[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "manufacturing-intelligence-platform"
version = "0.1.0"
description = "AI-enabled manufacturing analytics portfolio project"
requires-python = ">=3.10"
dependencies = [
  "pyarrow>=18,<23",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
  "tableauhyperapi>=0.0.20000,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
