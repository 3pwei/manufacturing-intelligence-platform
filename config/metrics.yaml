version: 1
metrics:
  production_quantity:
    label: Production Quantity
    expression: completed_qty
    aggregation: sum
    canonical: true
  pass_quantity:
    label: Pass Quantity
    expression: first_pass_pass_qty
    aggregation: sum
    scope: first_pass
    canonical: true
  fail_quantity:
    label: Fail Quantity
    expression: fail_qty
    aggregation: sum
    scope: first_pass
    canonical: true
  fpy:
    label: First Pass Yield
    numerator: first_pass_pass_qty
    denominator: first_pass_pass_qty + fail_qty
    format: percentage
    canonical: true
  defect_rate:
    label: Defect Rate
    numerator: defective_units
    denominator: inspected_units
    format: percentage
    canonical: true
  dppm:
    label: Defects Per Million
    numerator: defective_units
    denominator: inspected_units
    multiplier: 1000000
    canonical: true
  rework_rate:
    label: Rework Rate
    numerator: rework_qty
    denominator: completed_qty
    format: percentage
    canonical: true
  scrap_rate:
    label: Scrap Rate
    numerator: scrap_qty
    denominator: completed_qty
    format: percentage
    canonical: true
  yield_loss:
    label: Yield Loss
    expression: 1 - fpy
    format: percentage
    canonical: true
  wow_fpy_change:
    label: WoW FPY Change
    expression: current_week_fpy - previous_week_fpy
    format: percentage_points
    canonical: true
  supplier_attributed_defect_rate:
    label: Supplier-attributed Defect Rate
    numerator: supplier_attributed_defective_units
    denominator: inspected_units_linked_to_supplier
    format: percentage
    attribution_caveat: true
    canonical: true
