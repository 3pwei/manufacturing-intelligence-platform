bundle:
  name: manufacturing-intelligence-platform

include:
  - databricks/jobs/*.yml

artifacts:
  default:
    type: whl
    path: .
    build: python -m pip wheel . --no-deps --wheel-dir dist

sync:
  exclude:
    - .venv/
    - data/generated/

targets:
  dev:
    mode: development
    default: true
